<!DOCTYPE html>
<html>
<head>
    <title>ruangobrol</title>
    <link rel="icon" href="/img/favicon.png">
    <link rel="stylesheet" href="/css/styles.min.css">
</head>
<body>
    <div class="chat">
        <div id="sidebar" class="chat__sidebar"></div>

        <div class="chat__main">
            <div id="messages" class="chat__messages"></div>

            <div class="compose">
                <form id="form-pesan">
                    <input
                        name="pesan"
                        placeholder="Pesan"
                        required
                        autocomplete="off"
                    >
                    <button>Kirim</button>
                </form>

                <button id="kirim-lokasi">Share Lokasi</button>
            </div>
        </div>
    </div>

    <script id="message-template" type="text/html">
        <div class="message">
            <p>
                <span class="message__name">{{username}}</span>
                <span class="message__meta">{{createdAt}}</span>
            </p>
            <p>{{message}}</p>
        </div>
    </script>

    <script id="locationMessage-template" type="text/html">
        <div class="message">
            <p>
                <span class="message__name">{{username}}</span>
                <span class="message__meta">{{createdAt}}</span>
            </p>
            <p>
                <a href="{{url}}" target="_blank">Lokasi saya sekarang</a>
            </p>
        </div>
    </script>

    <script id="sidebar-template" type="text/html">
        <h2 class="room-title">Ruang: {{room}}</h2>
        <h3 class="list-title">Anggota Ruang</h3>
        <ul class="users">
            {{#users}}
            <li>- {{username}}</li>
            {{/users}}
        </ul>
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mustache.js/3.0.1/mustache.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.22.2/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qs/6.6.0/qs.min.js"></script>

    <!-- Optional: set this global before loading chat.js when deploying to Vercel
         e.g. window.socketServerUrl = 'https://your-server.onrender.com'; -->
    <script>
        // window.socketServerUrl = 'https://your-server.onrender.com';
    </script>

    <!-- Load Socket.io client from CDN as a fallback, then try same-origin socket.io client -->
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script src="/js/chat.js"></script>
</body>
</html>
